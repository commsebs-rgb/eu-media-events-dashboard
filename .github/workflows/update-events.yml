name: Update event data

on:
  schedule:
    - cron: "17 5 * * *" # every 24 hours, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  update-events:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape official event sources
        env:
          START_DATE: "2026-01-01"
          END_DATE: "2026-12-31"
        run: python scraper.py

      - name: Show output summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("data/events.json")
          print("events.json exists:", p.exists())

          if p.exists():
              data = json.loads(p.read_text())
              events = data.get("events", [])
              print("events found:", len(events))
              print("date window:", data.get("date_window"))
              print("last updated:", data.get("last_updated_utc"))

              print("\nFirst 10 events:")
              for e in events[:10]:
                  sponsors = [s.get("name") for s in e.get("sponsors", [])[:8]]
                  print("-", e.get("organization"), "|", e.get("date"), "|", e.get("title"), "| sponsors:", sponsors)
          PY

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update official event data"
          file_pattern: data/events.json
