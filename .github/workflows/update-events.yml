name: Update event data

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  update-events:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape official event sources
        env:
          END_DATE: "2026-12-31"
        run: python scraper.py

      - name: Show output summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/events.json")
          print("events.json exists:", p.exists())
          if p.exists():
              data = json.loads(p.read_text())
              events = data.get("events", [])
              print("events found:", len(events))
              print("generated_at:", data.get("generated_at"))
              for e in events[:5]:
                  print("-", e.get("organization"), e.get("date"), e.get("title"))
          PY

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update official event data"
          file_pattern: data/events.json
